[package]
name = "ember-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client for ember: the Scheduler (node lifecycle) and CLN Node gRPC services."
repository = "https://github.com/liquid-lightning/ember-client"

[dependencies]
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
thiserror = "2"
secp256k1 = "0.29"
hkdf = "0.12"
sha2 = "0.10"
rcgen = "0.14.10"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bip39 = { version = "2", features = ["rand_core"] }
secp256k1 = { version = "0.29", features = ["rand-std"] }
