syntax = "proto3";

package ember.scheduler.v1;

service Scheduler {
	rpc GetChallenge(ChallengeRequest) returns (ChallengeResponse) {}
	rpc Register(RegistrationRequest) returns (RegistrationResponse) {}
	rpc Recover(RecoveryRequest) returns (RecoveryResponse) {}
	rpc GetNodeInfo(NodeInfoRequest) returns (NodeInfoResponse) {}
	rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {}
	rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse) {}
}

enum NodePhase {
	NODE_PHASE_UNSPECIFIED = 0;
	NODE_PHASE_PROVISIONING = 1;
	NODE_PHASE_RUNNING = 2;
	NODE_PHASE_STOPPED = 3;
	NODE_PHASE_FAILED = 4;
	NODE_PHASE_DELETING = 5;
}

message NodeSummary {
	string node_id = 1;
	NodePhase phase = 2;
	string created_at = 3;
}

message ChallengeRequest {
	// The caller's auth pubkey (compressed secp256k1, 33 bytes), derived
	// client-side from its BIP39 seed. Scopes the challenge to this
	// identity so a signature over it can't be replayed for another.
	bytes node_id = 1;
}

message ChallengeResponse {
	bytes challenge = 1;
}

message RegistrationRequest {
	string network = 1;
	bytes challenge = 2;
	bytes signature = 3;
	bytes csr = 4;
	string invite_code = 5;
	// Compressed secp256k1 pubkey proven by `signature` over `challenge`.
	// Stored as this node's recovery identity.
	bytes node_id = 6;
	// Client-generated BIP39 mnemonic. ember is custodial: the server
	// derives the real CLN `hsm_secret` straight from this text (see
	// `domain::mnemonic::hsm_secret_file`) rather than from `node_id`,
	// which is a separate, ember-only auth key.
	string mnemonic = 7;
}

message RegistrationResponse {
	string node_id = 1;
	string mnemonic = 2;
	string device_cert = 3;
	string device_key = 4;
	string rune = 5;
	bytes creds = 6;
}

message RecoveryRequest {
	string mnemonic = 1;
	bytes challenge = 2;
	bytes signature = 3;
	bytes csr = 4;
	// Compressed secp256k1 pubkey proven by `signature` over `challenge`;
	// looked up against the pubkey stored at registration to find the
	// existing node instead of provisioning a new one.
	bytes node_id = 5;
}

message RecoveryResponse {
	string node_id = 1;
	string device_cert = 2;
	string device_key = 3;
	string rune = 4;
	bytes creds = 5;
}

message NodeInfoRequest {
	string node_id = 1;
}

message NodeInfoResponse {
	NodeSummary node = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
	repeated NodeSummary nodes = 1;
}

message DeleteNodeRequest {
	string node_id = 1;
}

message DeleteNodeResponse {}
