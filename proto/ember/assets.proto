syntax = "proto3";

package ember.assets.v1;

// ember's own client-facing contract for cross-asset payments - not a
// mirror of CLN's own RPC set (that's proto/cln/node.proto, generated
// from cln-grpc's own built-in methods). AssetInvoice/QuoteAssetInvoice/
// PayAssetInvoice are implemented by proxying to the per-node
// cln.assetswap.v1.AssetSwap service (infra/images/cln's patched
// cln-grpc, see bin/server/src/assets_service.rs) the same way every CLN
// RPC is proxied to the caller's own node in node_proxy.rs. ListAssets is
// pure server-side data (bin/server/src/config.rs's SUPPORTED_ASSETS plus
// each asset's price pair from the DB) - no per-node call at all.
service Assets {
	rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {}
	rpc AssetInvoice(AssetInvoiceRequest) returns (AssetInvoiceResponse) {}
	rpc QuoteAssetInvoice(QuoteAssetInvoiceRequest) returns (QuoteAssetInvoiceResponse) {}
	rpc PayAssetInvoice(PayAssetInvoiceRequest) returns (PayAssetInvoiceResponse) {}
	// Proxies to the caller's own node's cln.assetswap.v1.AssetSwap::
	// ListAssetBalances - per-node, like AssetInvoice/QuoteAssetInvoice/
	// PayAssetInvoice, not server config like ListAssets.
	rpc GetAssetBalances(GetAssetBalancesRequest) returns (GetAssetBalancesResponse) {}
	// Pure server config, like ListAssets - no per-node call, no device
	// identity required. Empty node_id/addr when unconfigured (the
	// default); set via `ember-cli set-swap-service`.
	rpc GetSwapService(GetSwapServiceRequest) returns (GetSwapServiceResponse) {}
	// The caller's own on-chain asset wallet (its node's elementsd wallet,
	// see cln.assetswap.v1): per-node, proxied like GetAssetBalances.
	// Balances, including the wallet's L-BTC for fees, come from
	// GetAssetBalances.
	rpc NewAssetAddress(NewAssetAddressRequest) returns (NewAssetAddressResponse) {}
	rpc SendAsset(SendAssetRequest) returns (SendAssetResponse) {}
	rpc OpenAssetChannel(OpenAssetChannelRequest) returns (OpenAssetChannelResponse) {}
	// The caller's own asset wallet's unspent outputs (unconfirmed
	// included) - per-node, proxied like GetAssetBalances.
	rpc ListAssetUtxos(ListAssetUtxosRequest) returns (ListAssetUtxosResponse) {}
	// That wallet's transaction history (assetchan-listtransactions): per
	// tx the net change per asset.
	rpc ListAssetTransactions(ListAssetTransactionsRequest) returns (ListAssetTransactionsResponse) {}
	// Testnet faucet (`ember-cli set-faucet`): what claiming `asset` pays
	// out, what's left, and when the caller's node may claim next.
	rpc GetFaucet(GetFaucetRequest) returns (GetFaucetResponse) {}
	// Pays the faucet's amount of `asset` to the caller's own node: an
	// issued asset from ember's elementsd faucet wallet into the node's
	// asset wallet, L-BTC from liquidtestnet.com into its CLN wallet.
	// FAILED_PRECONDITION while the node is still cooling down.
	rpc ClaimFaucet(ClaimFaucetRequest) returns (ClaimFaucetResponse) {}
}

message Asset {
	// Opaque id (e.g. a Liquid asset id, or "lbtc") - never interpreted,
	// just carried through to assetswap-plugin/pricetiers-plugin, which
	// use the same convention themselves.
	string id = 1;
	string symbol = 2;
	string name = 3;
	// This asset's reference price, from ember's price pairs (`ember-cli
	// set-price-pair`, the same table every node's pricetiers-plugin
	// polls) - unset when no pair prices it.
	optional AssetPrice price = 4;
	// Decimal places of one whole unit (Liquid asset precision): amounts
	// stay in msat (1000 msat per base unit), shown as
	// base_units / 10^precision. Unset from servers that predate it -
	// clients assume 8 then.
	optional uint32 precision = 5;
}

// The pair whose to_asset is this asset: rate_ppm msat of from_asset
// (normally "lbtc") per 1_000_000 msat of this asset, plus a flat
// fee_base_msat per swap.
message AssetPrice {
	string from_asset = 1;
	uint64 rate_ppm = 2;
	uint64 fee_base_msat = 3;
}

message ListAssetsRequest {}

message ListAssetsResponse {
	repeated Asset assets = 1;
}

message AssetInvoiceRequest {
	string asset = 1;
	uint64 amount_msat = 2;
	string label = 3;
	string description = 4;
}

message AssetInvoiceResponse {
	// The self-contained wrapper string to share/scan - not a bare
	// bolt11, since BOLT11 has no asset field at all (see
	// CROSS_ASSET_SWAP.md). bolt11/payment_hash below are decoded
	// server-side from the same wrapper for display convenience, not
	// returned separately on the wire by the underlying plugin RPC.
	string wrapped = 1;
	string bolt11 = 2;
	string payment_hash = 3;
}

message QuoteAssetInvoiceRequest {
	string wrapped = 1;
}

message AssetQuoteTier {
	string name = 1;
	uint64 rate_ppm = 2;
	uint64 from_amount_msat = 3;
}

message QuoteAssetInvoiceResponse {
	string from_asset = 1;
	uint64 rate_ppm = 2;
	uint64 fee_base_msat = 3;
	repeated AssetQuoteTier tiers = 4;
}

message PayAssetInvoiceRequest {
	string wrapped = 1;
	optional string tier = 2;
	optional string from_asset = 3;
	optional uint64 from_amount_msat = 4;
}

message PayAssetInvoiceResponse {
	string payment_preimage = 1;
	string status = 2;
}

message GetAssetBalancesRequest {}

message AssetBalance {
	string asset = 1;
	uint64 channel_balance_msat = 2;
	uint64 onchain_balance_msat = 3;
}

message GetAssetBalancesResponse {
	repeated AssetBalance balances = 1;
	// L-BTC in the asset wallet: pays on-chain fees for SendAsset and
	// OpenAssetChannel. Topped up by sending L-BTC to a NewAssetAddress
	// address.
	uint64 asset_wallet_lbtc_msat = 2;
}

message NewAssetAddressRequest {}

message NewAssetAddressResponse {
	string address = 1;
}

message SendAssetRequest {
	string address = 1;
	string asset = 2;
	// 1000 msat per base unit of the asset; must be whole units.
	uint64 amount_msat = 3;
}

message SendAssetResponse {
	string txid = 1;
}

message OpenAssetChannelRequest {
	// Must already be connected (ConnectPeer via the node proxy).
	string peer_id = 1;
	string asset = 2;
	uint64 amount_msat = 3;
	optional uint64 fee_reserve_sat = 4;
	bool announce = 5;
	// Dual-funded (open_channel2): the swap service puts in as much of the
	// asset as we do. Both nodes need experimental-dual-fund.
	bool dual_fund = 6;
}

message OpenAssetChannelResponse {
	string txid = 1;
	string channel_id = 2;
}

message GetSwapServiceRequest {}

message GetSwapServiceResponse {
	// Both empty when unconfigured.
	optional string node_id = 1;
	optional string addr = 2;
}

message ListAssetUtxosRequest {}

message AssetUtxo {
	string txid = 1;
	uint32 vout = 2;
	// "lbtc" for L-BTC (the wallet's fee balance), else the asset's id.
	string asset = 3;
	// 1000 msat per base unit.
	uint64 amount_msat = 4;
	string address = 5;
	// 0 = unconfirmed.
	uint32 confirmations = 6;
}

message ListAssetUtxosResponse {
	repeated AssetUtxo utxos = 1;
}

message ListAssetTransactionsRequest {}

message AssetTxAmount {
	// "lbtc" for L-BTC, else the asset's id.
	string asset = 1;
	// Signed net change for the wallet, 1000 msat per base unit.
	int64 amount_msat = 2;
}

message AssetWalletTx {
	string txid = 1;
	// 0 = unconfirmed.
	uint32 blockheight = 2;
	uint64 time = 3;
	// Net change per asset, the fee excluded.
	repeated AssetTxAmount amounts = 4;
	// L-BTC fee this wallet paid for the tx (0 if it didn't fund it).
	uint64 fee_msat = 5;
	// Each wallet entry: what moved to/from which address (ours for a
	// receive, the destination for a send).
	repeated AssetTxOutput outputs = 6;
}

message AssetTxOutput {
	// "lbtc" for L-BTC, else the asset's id.
	string asset = 1;
	// Signed, 1000 msat per base unit.
	int64 amount_msat = 2;
	string address = 3;
}

message ListAssetTransactionsResponse {
	repeated AssetWalletTx transactions = 1;
}

message GetFaucetRequest {
	// "lbtc" or an issued asset id.
	string asset = 1;
}

message GetFaucetResponse {
	// False when no faucet is set for the asset; nothing else is set then.
	bool enabled = 1;
	// What one claim pays out, 1000 msat per base unit.
	uint64 amount_msat = 2;
	// What the faucet still holds; unset when it couldn't be read.
	optional uint64 balance_msat = 3;
	// Cooldown between two claims by the same node.
	uint64 interval_secs = 4;
	// Unix time the caller's node may claim again; 0 = now.
	uint64 next_claim_at = 5;
	// The caller's node is exempt from the cooldown.
	bool unlimited = 6;
}

message ClaimFaucetRequest {
	string asset = 1;
}

message ClaimFaucetResponse {
	string txid = 1;
	uint64 amount_msat = 2;
	// Where it was sent: the node's asset wallet or, for L-BTC, CLN's.
	string address = 3;
	// Unix time the node may claim again; 0 = now (exempt).
	uint64 next_claim_at = 4;
}
